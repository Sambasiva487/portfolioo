<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#faf7f2"/>
  <!-- hero banner -->
  <rect y="0" width="800" height="180" fill="#292524"/>
  <text x="60" y="78" font-family="sans-serif" font-size="26" font-weight="bold" fill="#fff">The Edit</text>
  <text x="60" y="110" font-family="sans-serif" font-size="14" fill="#d6d3d1">Curated pieces, honest price.</text>
  <rect x="620" y="26" width="120" height="34" rx="17" fill="#fff"/>
  <text x="680" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#292524">Shop all</text>
  <!-- filter row -->
  <g transform="translate(60,200)">
    <rect width="80" height="32" rx="16" fill="#292524"/><text x="40" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">All</text>
    <rect x="90" width="80" height="32" rx="16" fill="#e7e5e4"/><text x="130" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#57534e">Tops</text>
    <rect x="180" width="80" height="32" rx="16" fill="#e7e5e4"/><text x="220" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#57534e">Bottoms</text>
    <rect x="270" width="120" height="32" rx="16" fill="#e7e5e4"/><text x="330" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#57534e">Accessories</text>
    <rect x="620" width="80" height="32" rx="16" fill="none" stroke="#292524"/><text x="660" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#292524">Filters</text>
  </g>
  <!-- product grid -->
  <g transform="translate(60,260)">
    <g font-family="sans-serif">
      <g><rect width="160" height="200" rx="8" fill="#fff" stroke="#e7e5e4"/><rect x="0" width="160" height="130" fill="#f5f5f4"/><rect x="14" y="146" width="100" height="12" rx="6" fill="#d6d3d1"/><rect x="14" y="164" width="60" height="10" rx="5" fill="#292524"/><rect x="118" y="164" width="28" height="10" rx="5" fill="#78716c"/></g>
      <g transform="translate(180,0)"><rect width="160" height="200" rx="8" fill="#fff" stroke="#e7e5e4"/><rect x="0" width="160" height="130" fill="#f5f5f4"/><rect x="14" y="146" width="100" height="12" rx="6" fill="#d6d3d1"/><rect x="14" y="164" width="60" height="10" rx="5" fill="#292524"/><rect x="118" y="164" width="28" height="10" rx="5" fill="#78716c"/></g>
      <g transform="translate(360,0)"><rect width="160" height="200" rx="8" fill="#fff" stroke="#e7e5e4"/><rect x="0" width="160" height="130" fill="#f5f5f4"/><rect x="14" y="146" width="100" height="12" rx="6" fill="#d6d3d1"/><rect x="14" y="164" width="60" height="10" rx="5" fill="#292524"/><rect x="118" y="164" width="28" height="10" rx="5" fill="#78716c"/></g>
      <g transform="translate(540,0)"><rect width="160" height="200" rx="8" fill="#fff" stroke="#e7e5e4"/><rect x="0" width="160" height="130" fill="#f5f5f4"/><rect x="14" y="146" width="100" height="12" rx="6" fill="#d6d3d1"/><rect x="14" y="164" width="60" height="10" rx="5" fill="#292524"/><rect x="118" y="164" width="28" height="10" rx="5" fill="#78716c"/></g>
    </g>
  </g>
  <text x="400" y="520" text-anchor="middle" font-family="monospace" font-size="13" fill="#a8a29e">B2C e-commerce PDP / PLP / cart, visual-first, conversion-built</text>
  <rect x="330" y="540" width="140" height="38" rx="19" fill="#292524"/>
  <text x="400" y="565" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff">View details</text>
</svg>