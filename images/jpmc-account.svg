<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f8fafc"/>
  <!-- top nav -->
  <rect width="800" height="60" fill="#0a2540"/>
  <text x="40" y="38" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">Account Overview</text>
  <rect x="600" y="14" width="160" height="32" rx="16" fill="#1e5aa8"/>
  <text x="680" y="34" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff" font-weight="bold">Transfer & Pay</text>
  <!-- account summary cards -->
  <g transform="translate(40,90)">
    <g><rect width="220" height="110" rx="12" fill="#fff" stroke="#e5e7eb"/>
      <text x="20" y="32" font-family="sans-serif" font-size="12" fill="#6b7280">Total checking</text>
      <text x="20" y="62" font-family="sans-serif" font-size="28" font-weight="bold" fill="#111">$12,380</text>
      <text x="20" y="84" font-family="sans-serif" font-size="11" fill="#059669">▲ 12% this month</text>
    </g>
    <g transform="translate(240,0)"><rect width="220" height="110" rx="12" fill="#fff" stroke="#e5e7eb"/>
      <text x="20" y="32" font-family="sans-serif" font-size="12" fill="#6b7280">Savings</text>
      <text x="20" y="62" font-family="sans-serif" font-size="28" font-weight="bold" fill="#111">$48,200</text>
      <text x="20" y="84" font-family="sans-serif" font-size="11" fill="#059669">▲ 4% this month</text>
    </g>
    <g transform="translate(480,0)"><rect width="220" height="110" rx="12" fill="#fff" stroke="#e5e7eb"/>
      <text x="20" y="32" font-family="sans-serif" font-size="12" fill="#6b7280">Credit card</text>
      <text x="20" y="62" font-family="sans-serif" font-size="28" font-weight="bold" fill="#111">$2,140</text>
      <text x="20" y="84" font-family="sans-serif" font-size="11" fill="#dc2626">Due in 5 days</text>
    </g>
  </g>
  <!-- quick actions -->
  <g transform="translate(40,220)">
    <text y="0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111">Quick actions</text>
    <g transform="translate(0,20)">
      <rect width="90" height="36" rx="18" fill="#e0e7ff"/><text x="45" y="23" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e5aa8">Send</text>
      <rect x="100" width="90" height="36" rx="18" fill="#e0e7ff"/><text x="145" y="23" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e5aa8">Deposit</text>
      <rect x="200" width="90" height="36" rx="18" fill="#e0e7ff"/><text x="245" y="23" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e5aa8">Pay</text>
      <rect x="300" width="90" height="36" rx="18" fill="#e0e7ff"/><text x="345" y="23" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e5aa8">Wire</text>
    </g>
  </g>
  <!-- transactions table -->
  <g transform="translate(40,310)">
    <text y="0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111">Recent transactions</text>
    <g transform="translate(0,20)">
      <g font-family="sans-serif" font-size="12">
        <rect width="700" height="44" rx="8" fill="#fff" stroke="#e5e7eb"/><text x="16" y="27" fill="#111">Blue Bottle Coffee · SF</text><text x="660" y="27" fill="#111" text-anchor="end">- $6.40</text>
        <rect y="54" width="700" height="44" rx="8" fill="#fff" stroke="#e5e7eb"/><text x="16" y="81" fill="#111">Salary deposit, Acme Corp</text><text x="660" y="81" fill="#059669" text-anchor="end">+ $4,200.00</text>
        <rect y="108" width="700" height="44" rx="8" fill="#fff" stroke="#e5e7eb"/><text x="16" y="135" fill="#111">Uber, Airport</text><text x="660" y="135" fill="#111" text-anchor="end">- $24.10</text>
        <rect y="162" width="700" height="44" rx="8" fill="#fff" stroke="#e5e7eb"/><text x="16" y="189" fill="#111">Amazon Marketplace</text><text x="660" y="189" fill="#111" text-anchor="end">- $182.90</text>
        <rect y="216" width="700" height="44" rx="8" fill="#fff" stroke="#e5e7eb"/><text x="16" y="243" fill="#111">Interest earned</text><text x="660" y="243" fill="#059669" text-anchor="end">+ $1.12</text>
      </g>
    </g>
  </g>
  <text x="40" y="582" font-family="monospace" font-size="12" fill="#94a3b8">information hierarchy · card-scannable layout · WCAG AA contrast</text>
</svg>