    <g transform="translate(240,0)"><rect width="220" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/><text x="18" y="34" font-size="16" fill="#fff" font-weight="bold">Nurture flows</text><text x="18" y="58" font-size="12" fill="#64748b">Multi-step email journeys</text></g>
