<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#0a2540"/>
  <rect width="800" height="600" fill="url(#jmgrad)" opacity=".9"/>
  <defs><linearGradient id="jmgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a2540"/><stop offset="1" stop-color="#1e5aa8"/></linearGradient></defs>
  <!-- top nav -->
  <g transform="translate(50,40)">
    <rect width="130" height="30" rx="4" fill="#fff"/>
    <text x="65" y="21" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0a2540">BANK</text>
    <rect x="560" width="120" height="30" rx="15" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="620" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Open account</text>
  </g>
  <!-- login card -->
  <g transform="translate(230,120)">
    <rect width="340" height="360" rx="12" fill="#fff"/>
    <text x="28" y="48" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0a2540">Welcome back</text>
    <text x="28" y="74" font-family="sans-serif" font-size="13" fill="#5f6872">Sign in to your account</text>
    <rect x="28" y="94" width="284" height="42" rx="6" fill="#f3f4f6"/><text x="42" y="120" font-family="sans-serif" font-size="12" fill="#9ca3af">Username</text>
    <rect x="28" y="146" width="284" height="42" rx="6" fill="#f3f4f6"/><text x="42" y="172" font-family="sans-serif" font-size="12" fill="#9ca3af">Password</text>
    <rect x="28" y="204" width="284" height="44" rx="22" fill="#1e5aa8"/>
    <text x="170" y="231" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">Sign in</text>
    <text x="170" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e5aa8">Forgot password?</text>
    <rect x="28" y="294" width="284" height="2" fill="#e5e7eb"/>
    <text x="170" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Not enrolled? <tspan fill="#1e5aa8" font-weight="bold">Sign up now</tspan></text>
  </g>
  <text x="400" y="540" text-anchor="middle" font-family="monospace" font-size="13" fill="#7dd3fc">secure auth flow · accessibility-first-first</text>
</svg>