<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#052e1f"/>
  <text x="400" y="64" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">Lead funnel, instrumented end to end</text>
  <!-- ladder inputs -->
  <g transform="translate(80,120)" font-family="monospace" font-size="13">
    <g><rect width="300" height="44" rx="8" fill="#064e3b"/><text x="16" y="28" fill="#86efac">event: page_view → tier=interest</text></g>
    <g transform="translate(0,58)"><rect width="300" height="44" rx="8" fill="#065f46"/><text x="16" y="28" fill="#a7f3d0">event: form_start → qualified</text></g>
    <g transform="translate(0,116)"><rect width="300" height="44" rx="8" fill="#047857"/><text x="16" y="28" fill="#d1fae5">event: form_submit → lead</text></g>
    <g transform="translate(0,174)"><rect width="300" height="44" rx="8" fill="#059669"/><text x="16" y="28" fill="#ffffff">event: email_confirm → MQL</text></g>
  </g>
  <!-- conversion card -->
  <g transform="translate(430,120)">
    <rect width="280" height="220" rx="14" fill="#fff"/>
    <text x="24" y="40" font-family="sans-serif" font-size="13" fill="#6b7280">Form completion rate</text>
    <polyline points="24,170 90,150 160,158 230,110 300,80" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
    <text x="230" y="70" font-family="sans-serif" font-size="34" font-weight="bold" fill="#052e1f">+31%</text>
  </g>
  <text x="400" y="470" font-family="monospace" font-size="14" fill="#6ee7b7" text-anchor="middle">every field has a reason to exist, or it gets cut</text>
<g><rect x="0" y="568" width="800" height="32" fill="#000" fill-opacity=".72"/><text x="400" y="589" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle">CONFIDENTIAL, client work, website details cannot be displayed. Illustrative mock.</text></g></svg>